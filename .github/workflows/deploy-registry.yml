name: Deploy Registry & Storybook to GitHub Pages

on:
  push:
    branches: [develop]
    paths:
      - "registry/**"
      - "registry.json"
      - "components/**"
      - "lib/**"
      - "stories/**"
      - ".storybook/**"
      - "app/globals.css"
      - "packages/tailwind-preset/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build registry
        run: npx shadcn build

      - name: Build Storybook
        run: npx storybook build -o public/storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
